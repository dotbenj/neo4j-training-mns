services:
  neo4j:
    build:
      context: .
      args:
        NEO4J_VERSION: ${NEO4J_VERSION}
    container_name: neo4j-dev
    restart: unless-stopped

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"

      # Active APOC automatiquement
      NEO4J_PLUGINS: '["apoc"]'

      # Nécessaire pour certaines procédures APOC en dev
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

      # Écoute sur toutes les interfaces du container
      NEO4J_server_default__listen__address: "0.0.0.0"

      # Réglages mémoire raisonnables pour un environnement de dev
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs: